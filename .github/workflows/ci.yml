name: CI

on:
  push:
  pull_request:

jobs:
  build:
    name: ${{ matrix.os }}
    runs-on: ${{ matrix.os }}

    strategy:
      fail-fast: false
      matrix:
        os:
          - ubuntu-latest
          - macos-latest
          - windows-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Check Ninja
        run: ninja --version

      - name: Configure
        run: cmake --preset default

      - name: Build and Run
        run: cmake --build --preset default-debug --target run-hello
